# Static Traefik config for local QEComp dev (*.vex.localhost).
# TLS uses Traefik's own auto-generated self-signed default certificate
# (no ACME, no mkcert) — browsers will show a "not secure" warning, which
# is expected for local dev. Accept it once per browser/host.

log:
  level: INFO

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

api:
  dashboard: true
  insecure: false

providers:
  docker:
    exposedByDefault: false
  file:
    directory: /etc/traefik/dynamic
    watch: true
