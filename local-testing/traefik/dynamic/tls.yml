# Self-signed cert (SAN: vex.localhost, *.vex.localhost) generated by
# local-testing/traefik/certs — set as Traefik's default so hostname validation
# passes for every *.vex.localhost router (Traefik's own auto-generated
# default cert has no SANs at all, which fails hostname checks from
# clients that verify certs, e.g. the backend's own outbound OIDC calls
# to Authelia).
tls:
  stores:
    default:
      defaultCertificate:
        certFile: /etc/traefik/certs/vex.localhost.crt
        keyFile: /etc/traefik/certs/vex.localhost.key
  certificates:
    - certFile: /etc/traefik/certs/vex.localhost.crt
      keyFile: /etc/traefik/certs/vex.localhost.key
