# Dynamic Traefik config for pieces that aren't discovered via Docker
# labels. QEComp backend routing (vex.localhost, api.vex.localhost) now
# comes from the `backend` service's labels in
# local-testing/docker-compose.replicas.yml, load-balanced across however
# many `--scale backend=N` replicas are running. Authelia is also
# discovered via Docker labels (see local-testing/docker-compose.proxy.yml).

http:
  middlewares:
    authelia-forwardauth:
      forwardAuth:
        address: "http://authelia:9091/api/verify?rd=https://authelia.vex.localhost"
        trustForwardHeader: true
        authResponseHeaders:
          - Remote-User
          - Remote-Groups
          - Remote-Name
          - Remote-Email

  routers:
    # Traefik's own dashboard, protected by Authelia (forward-auth) as a
    # working example of the same pattern the real app would use if it
    # ever needed a second Authelia-protected internal tool.
    traefik-dashboard:
      rule: "Host(`traefik.vex.localhost`)"
      entryPoints: ["websecure"]
      service: api@internal
      tls: {}
      middlewares:
        - authelia-forwardauth
