name: qecomp-proxy
# Local reverse-proxy + SSO stack for QEComp dev: Traefik fronts everything
# at *.vex.localhost, Authelia provides OIDC login. Standalone from the
# repo root `compose.yml` (which owns the unrelated cloudflared tunnel and
# the qecomp Postgres/Redis/MinIO services) — bring both up together:
#
#   docker compose -f compose.yml -f local-testing/docker-compose.proxy.yml up -d
#
# *.vex.localhost resolves to 127.0.0.1 automatically (the .localhost TLD
# is reserved for loopback per RFC 6761) — no /etc/hosts edits needed on
# macOS/modern Linux.
#
# TLS uses a self-signed cert generated by ./setup.sh (SAN: vex.localhost,
# *.vex.localhost) — browsers will warn "not secure"; accept it once per
# host. See local-testing/README.md for why a real (if self-signed) SAN
# cert is needed instead of Traefik's own auto-generated default one (no
# mkcert/system trust store changes were made).
#
# The QEComp backend (uvicorn) and frontend (Vite dev server) are expected
# to be running on the HOST, not in this compose file — Traefik reaches
# them via `host.docker.internal` (see local-testing/traefik/dynamic/routes.yml).
# Start them yourself, e.g.:
#   uvicorn backend.main:app --host 0.0.0.0 --port 8000
#   (cd frontend && npm run dev -- --host 0.0.0.0)

services:
  traefik:
    image: traefik:latest
    container_name: qecomp-traefik
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/certs:/etc/traefik/certs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  authelia:
    image: authelia/authelia:latest
    container_name: qecomp-authelia
    volumes:
      - ./authelia/configuration.yml:/config/configuration.yml:ro
      - ./authelia/users_database.yml:/config/users_database.yml:ro
      - qecomp_authelia_data:/config/data
      - ./authelia/.jwt_secret:/secrets/jwt_secret:ro
      - ./authelia/.session_secret:/secrets/session_secret:ro
      - ./authelia/.storage_encryption_key:/secrets/storage_encryption_key:ro
      - ./authelia/.oidc_hmac_secret:/secrets/oidc_hmac_secret:ro
      - ./authelia/oidc_issuer_private_key.pem:/secrets/oidc_issuer_private_key.pem:ro
    environment:
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /secrets/jwt_secret
      AUTHELIA_SESSION_SECRET_FILE: /secrets/session_secret
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /secrets/storage_encryption_key
      AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE: /secrets/oidc_hmac_secret
      AUTHELIA_IDENTITY_PROVIDERS_OIDC_ISSUER_PRIVATE_KEY_FILE: /secrets/oidc_issuer_private_key.pem
    networks:
      - proxy
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.authelia.rule=Host(`authelia.vex.localhost`)"
      - "traefik.http.routers.authelia.entrypoints=websecure"
      - "traefik.http.routers.authelia.tls=true"
      - "traefik.http.services.authelia.loadbalancer.server.port=9091"

networks:
  proxy:
    name: qecomp-proxy

volumes:
  qecomp_authelia_data:
