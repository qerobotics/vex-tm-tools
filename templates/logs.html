{% extends "base.html" %}

{% block title %}Server Logs{% endblock %}

{% block content %}
<style>
  #log-container {
    background: linear-gradient(135deg, #0b1226 0%, #1a1b26 100%);
    color: #c0caf5;
    font-family: 'SF Mono', 'Fira Code', 'Source Code Pro', 'Consolas', monospace;
    font-size: 0.9rem;
    padding: 1.25rem;
    border-radius: 8px;
    height: 70vh;
    overflow-y: auto;
    border: 1px solid rgba(122, 162, 247, 0.2);
    line-height: 1.6;
    white-space: pre-wrap;
    word-wrap: break-word;
    box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.3);
  }
  
  #log-container::-webkit-scrollbar {
    width: 10px;
  }
  
  #log-container::-webkit-scrollbar-track {
    background: rgba(0, 0, 0, 0.2);
    border-radius: 5px;
  }
  
  #log-container::-webkit-scrollbar-thumb {
    background: rgba(122, 162, 247, 0.3);
    border-radius: 5px;
  }
  
  #log-container::-webkit-scrollbar-thumb:hover {
    background: rgba(122, 162, 247, 0.5);
  }
  
  .log-line {
    display: flex;
    padding: 0.4rem 0.75rem;
    margin: 0.25rem 0;
    border-radius: 4px;
    transition: background 0.15s ease;
    border-left: 3px solid transparent;
  }
  
  .log-line:hover {
    background: rgba(255, 255, 255, 0.03);
  }
  
  .log-meta {
    color: #565f89;
    margin-right: 1rem;
    flex-shrink: 0;
    font-weight: 500;
    min-width: 140px;
  }
  
  .log-level {
    display: inline-block;
    padding: 0.15rem 0.5rem;
    border-radius: 3px;
    font-weight: 600;
    font-size: 0.75rem;
    margin-right: 0.5rem;
    min-width: 65px;
    text-align: center;
  }
  
  .log-message {
    flex-grow: 1;
    color: #a9b1d6;
  }
  
  /* Level-specific styling */
  .log-line[data-level="INFO"] {
    border-left-color: #7aa2f7;
  }
  
  .log-line[data-level="INFO"] .log-level {
    background: rgba(122, 162, 247, 0.2);
    color: #7dcfff;
  }
  
  .log-line[data-level="INFO"] .log-message {
    color: #c0caf5;
  }
  
  .log-line[data-level="WARNING"] {
    border-left-color: #e0af68;
    background: rgba(224, 175, 104, 0.05);
  }
  
  .log-line[data-level="WARNING"] .log-level {
    background: rgba(224, 175, 104, 0.25);
    color: #ff9e64;
  }
  
  .log-line[data-level="WARNING"] .log-message {
    color: #e0af68;
  }
  
  .log-line[data-level="ERROR"] {
    border-left-color: #f7768e;
    background: rgba(247, 118, 142, 0.08);
  }
  
  .log-line[data-level="ERROR"] .log-level {
    background: rgba(247, 118, 142, 0.3);
    color: #f7768e;
    font-weight: 700;
  }
  
  .log-line[data-level="ERROR"] .log-message {
    color: #f7768e;
    font-weight: 500;
  }
  
  .log-line[data-level="CRITICAL"] {
    border-left-color: #db4b4b;
    background: rgba(219, 75, 75, 0.12);
  }
  
  .log-line[data-level="CRITICAL"] .log-level {
    background: rgba(219, 75, 75, 0.4);
    color: #ff5370;
    font-weight: 700;
    animation: pulse-critical 2s ease-in-out infinite;
  }
  
  .log-line[data-level="CRITICAL"] .log-message {
    color: #ff5370;
    font-weight: 700;
  }
  
  @keyframes pulse-critical {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }
  
  .log-line[data-level="DEBUG"] {
    border-left-color: #bb9af7;
    opacity: 0.7;
  }
  
  .log-line[data-level="DEBUG"] .log-level {
    background: rgba(187, 154, 247, 0.2);
    color: #bb9af7;
  }
  
  .log-line[data-level="DEBUG"] .log-message {
    color: #9aa5ce;
    font-style: italic;
  }

  .controls-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
    background: var(--surface);
    padding: 1rem 1.5rem;
    border-radius: 8px;
    border: 1px solid rgba(122, 162, 247, 0.2);
  }
  
  .controls-bar h2 {
    margin: 0;
    color: var(--primary);
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  
  .but-row {
    display: flex;
    gap: 1rem;
    align-items: center;
  }
  
  .checkbox-label {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--fg);
    cursor: pointer;
  }
  
  .checkbox-label input[type="checkbox"] {
    cursor: pointer;
  }
</style>

<div class="controls-bar">
  <h2><i class="ri-file-list-3-line"></i> Server Logs</h2>
  <div class="but-row">
    <label class="checkbox-label">
      <input type="checkbox" id="autoscroll-toggle" checked>
      <span>Autoscroll</span>
    </label>
    <button id="clear-logs-btn" class="btn btn-secondary"><i class="ri-delete-bin-line"></i> Clear</button>
  </div>
</div>

<div id="log-container">
  <div id="log-content"></div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const logContent = document.getElementById('log-content');
    const logContainer = document.getElementById('log-container');
    const autoscrollToggle = document.getElementById('autoscroll-toggle');
    const clearLogsBtn = document.getElementById('clear-logs-btn');
    let eventSource;

    function connect() {
      // Close existing connection if any
      if (eventSource) {
        eventSource.close();
      }

      eventSource = new EventSource("{{ url_for('stream_logs') }}");

      eventSource.onmessage = function(event) {
        const line = event.data;
        const logLineEl = document.createElement('div');
        logLineEl.className = 'log-line';

        // Parse log line and add color based on level
        const parts = line.split(' - ');
        if (parts.length >= 4) {
            const timestamp = parts[0];
            const loggerName = parts[1];
            const level = parts[2];
            const message = parts.slice(3).join(' - ');
            
            logLineEl.dataset.level = level;
            logLineEl.innerHTML = `
              <span class="log-meta">${timestamp}</span>
              <span class="log-level">${level}</span>
              <span class="log-message">${escapeHtml(message)}</span>
            `;
        } else {
            logLineEl.innerHTML = `<span class="log-message">${escapeHtml(line)}</span>`;
        }
        
        logContent.appendChild(logLineEl);

        if (autoscrollToggle.checked) {
          logContainer.scrollTop = logContainer.scrollHeight;
        }
      };

      eventSource.onerror = function(err) {
        console.error("EventSource failed:", err);
        const errorLine = document.createElement('div');
        errorLine.className = 'log-line';
        errorLine.dataset.level = 'ERROR';
        errorLine.innerHTML = `<span class="log-message">--- Connection to log stream lost. Reconnecting... ---</span>`;
        logContent.appendChild(errorLine);
        eventSource.close();
        // Attempt to reconnect after a delay
        setTimeout(connect, 5000);
      };
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    clearLogsBtn.addEventListener('click', () => {
      logContent.innerHTML = '';
    });

    connect(); // Initial connection
  });
</script>
{% endblock %}
