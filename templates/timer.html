{% extends 'base.html' %}

{% block body_class %}full-width-timer-page{% endblock %}

{% block title %}Timer{% endblock %}

{% block content %}
<div class="timer-page">
    <div class="timer-display-container">
        <div id="timer-name" class="timer-name">Loading...</div>
        <div id="timer-display" class="timer-display">--:--</div>
        <div id="timer-message" class="timer-message"></div>
        <div id="display-message" class="display-message"></div>
        
        <div class="ready-button-container">
            <button id="ready-button" class="ready-button" onclick="markReady()">
                <i class="ri-checkbox-circle-line"></i> I'm Ready!
            </button>
        </div>
        
        <div id="team-info" class="team-info" style="display: none;">
            <h3>Match Teams</h3>
            <div id="teams-grid"></div>
        </div>
        
        <div id="field-info" class="field-info" style="display: none;">
            <h3>Upcoming Matches</h3>
            <div id="matches-list"></div>
        </div>
        
        <div id="spotify-controls" class="spotify-controls" style="display: none;">
            <div class="spotify-header">
                <h3><i class="ri-spotify-fill"></i> Now Playing</h3>
            </div>
            <div id="spotify-content">
                <div class="spotify-track-info">
                    <img id="spotify-album-art" src="" alt="Album Art" style="display: none;">
                    <div class="spotify-details">
                        <div id="spotify-track-name" class="spotify-track-name">-</div>
                        <div id="spotify-artist-name" class="spotify-artist-name">-</div>
                    </div>
                </div>
                <div class="spotify-progress">
                    <span id="spotify-current-time">0:00</span>
                    <div class="progress-bar">
                        <div id="spotify-progress-fill" class="progress-fill"></div>
                    </div>
                    <span id="spotify-duration">0:00</span>
                </div>
                <div class="spotify-buttons">
                    <button onclick="spotifyControl('previous')" class="spotify-btn" title="Previous">
                        <i class="ri-skip-back-fill"></i>
                    </button>
                    <button id="spotify-play-pause" onclick="spotifyTogglePlayPause()" class="spotify-btn spotify-btn-primary" title="Play/Pause">
                        <i class="ri-play-fill"></i>
                    </button>
                    <button onclick="spotifyControl('next')" class="spotify-btn" title="Next">
                        <i class="ri-skip-forward-fill"></i>
                    </button>
                </div>
            </div>
            <div id="spotify-error" class="spotify-error" style="display: none;">
                Spotify not available
            </div>
        </div>
    </div>
</div>

<style>
body.full-width-timer-page {
    margin: 0;
    padding: 0;
    overflow: hidden;
}

body.full-width-timer-page header {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    background: rgba(11,17,38,0.8);
}

.timer-page {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--bg) 0%, var(--bg-2) 50%, var(--surface) 100%);
    padding: 80px 2rem 2rem 2rem;
}

.timer-display-container {
    text-align: center;
    max-width: 1400px;
    width: 100%;
}

.timer-name {
    font-size: 2rem;
    color: var(--muted);
    margin-bottom: 2rem;
    font-weight: 300;
}

.timer-display {
    font-size: 12rem;
    font-weight: 700;
    color: var(--primary);
    font-family: 'Courier New', monospace;
    text-shadow: 0 0 30px rgba(122, 162, 247, 0.5);
    line-height: 1;
    margin-bottom: 2rem;
    transition: color 0.3s ease;
}

.timer-display.warning {
    color: #e0af68;
    text-shadow: 0 0 30px rgba(224, 175, 104, 0.5);
}

.timer-display.danger {
    color: var(--danger);
    text-shadow: 0 0 30px rgba(247, 118, 142, 0.5);
    animation: pulse 1s ease-in-out infinite;
}

.timer-display.overtime {
    color: var(--danger);
    text-shadow: 0 0 30px rgba(247, 118, 142, 0.5);
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
}

.timer-message {
    font-size: 2.5rem;
    color: var(--accent);
    min-height: 4rem;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.5s ease;
    font-weight: 500;
}

.timer-message.show {
    opacity: 1;
}

.display-message {
    font-size: 2rem;
    color: var(--accent);
    min-height: 3rem;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1rem;
    font-weight: 600;
    text-align: center;
    padding: 0 2rem;
}

.ready-button-container {
    margin: 2rem 0;
}

.ready-button {
    background: linear-gradient(135deg, var(--primary), #5a8fdb);
    color: white;
    border: none;
    padding: 1.5rem 3rem;
    font-size: 1.8rem;
    font-weight: 700;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(122, 162, 247, 0.4);
    display: inline-flex;
    align-items: center;
    gap: 0.75rem;
}

.ready-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(122, 162, 247, 0.6);
}

.ready-button:active {
    transform: translateY(0);
}

.ready-button.pressed {
    background: linear-gradient(135deg, #4CAF50, #45a049);
    animation: ready-pulse 1.5s ease-in-out infinite;
}

@keyframes ready-pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.8; transform: scale(0.98); }
}

.team-info {
    margin-top: 3rem;
    background: rgba(17, 24, 39, 0.6);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 2rem;
    backdrop-filter: blur(10px);
}

.team-info h3 {
    color: var(--primary);
    margin-bottom: 1.5rem;
    font-size: 1.5rem;
}

#teams-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 1rem;
}

.team-card {
    background: rgba(11, 17, 38, 0.8);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    padding: 1.5rem;
    text-align: left;
}

.team-card.red-alliance {
    border-left: 4px solid #f77a8e;
}

.team-card.blue-alliance {
    border-left: 4px solid #7aa2f7;
}

.team-number {
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 0.5rem;
}

.team-name {
    font-size: 1.2rem;
    color: var(--fg);
    margin-bottom: 0.5rem;
}

.team-location {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 1rem;
}

.team-stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.5rem;
    font-size: 0.9rem;
}

.stat-item {
    display: flex;
    justify-content: space-between;
    padding: 0.25rem;
}

.stat-label {
    color: var(--muted);
}

.stat-value {
    color: var(--fg);
    font-weight: 600;
}

.field-info {
    margin-top: 4rem;
    background: rgba(17, 24, 39, 0.6);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 2rem;
    backdrop-filter: blur(10px);
}

.field-info h3 {
    color: var(--primary);
    margin-bottom: 1.5rem;
    font-size: 1.5rem;
}

#matches-list {
    display: grid;
    gap: 1rem;
}

.match-item {
    background: rgba(11, 17, 38, 0.8);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    padding: 1rem 1.5rem;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 1.5rem;
    align-items: center;
    text-align: left;
}

.match-number {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--primary);
    min-width: 60px;
}

.match-teams {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
}

.team {
    color: var(--fg);
    font-size: 1.1rem;
}

.match-time {
    color: var(--muted);
    font-size: 0.9rem;
    white-space: nowrap;
}

/* Spotify Controls */
.spotify-controls {
    margin-top: 4rem;
    background: rgba(17, 24, 39, 0.6);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 2rem;
    backdrop-filter: blur(10px);
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
}

.spotify-header {
    display: flex;
    align-items: center;
    margin-bottom: 1.5rem;
}

.spotify-header h3 {
    color: var(--primary);
    font-size: 1.5rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin: 0;
}

.spotify-header i {
    color: #1DB954;
}

.spotify-track-info {
    display: flex;
    gap: 1rem;
    margin-bottom: 1.5rem;
    align-items: center;
}

#spotify-album-art {
    width: 80px;
    height: 80px;
    border-radius: 4px;
    object-fit: cover;
}

.spotify-details {
    flex: 1;
    min-width: 0;
}

.spotify-track-name {
    font-size: 1.2rem;
    font-weight: 600;
    color: var(--fg);
    margin-bottom: 0.25rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.spotify-artist-name {
    color: var(--muted);
    font-size: 1rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.spotify-progress {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
    font-size: 0.9rem;
    color: var(--muted);
}

.progress-bar {
    flex: 1;
    height: 6px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 3px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    background: var(--primary);
    border-radius: 3px;
    transition: width 0.2s linear;
}

.spotify-buttons {
    display: flex;
    justify-content: center;
    gap: 1rem;
}

.spotify-btn {
    background: rgba(122, 162, 247, 0.1);
    border: 1px solid rgba(122, 162, 247, 0.3);
    color: var(--primary);
    padding: 0.75rem 1.25rem;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    width: 50px;
    height: 50px;
}

.spotify-btn:hover {
    background: rgba(122, 162, 247, 0.2);
    border-color: var(--primary);
    transform: scale(1.05);
}

.spotify-btn-primary {
    background: var(--primary);
    color: var(--bg);
    border-color: var(--primary);
    width: 60px;
    height: 60px;
    font-size: 1.8rem;
}

.spotify-btn-primary:hover {
    background: #8aa9ff;
    border-color: #8aa9ff;
}

.spotify-error {
    color: var(--muted);
    text-align: center;
    padding: 2rem;
}

/* Timer dropdown in navbar */
.timer-dropdown {
    position: relative;
    display: inline-block;
}

.timer-dropdown-content {
    display: none;
    position: absolute;
    background-color: var(--surface);
    min-width: 200px;
    box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.3);
    z-index: 1000;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.1);
    padding: 0.5rem;
    max-height: 400px;
    overflow-y: auto;
}

.timer-dropdown:hover .timer-dropdown-content {
    display: block;
}

.timer-dropdown-content a {
    color: var(--fg);
    padding: 8px 12px;
    text-decoration: none;
    display: block;
    border-radius: 4px;
    transition: background-color 0.2s;
}

.timer-dropdown-content a:hover {
    background-color: rgba(122, 162, 247, 0.1);
    color: var(--primary);
}

.timer-dropdown-content a.active {
    background-color: rgba(122, 162, 247, 0.2);
    color: var(--primary);
    font-weight: 600;
}

@media (max-width: 768px) {
    .timer-display {
        font-size: 8rem;
    }
    
    .timer-name {
        font-size: 1.5rem;
    }
    
    .timer-message {
        font-size: 1.8rem;
    }
    
    .field-info {
        margin-top: 2rem;
        padding: 1rem;
    }
    
    .ready-button {
        padding: 1rem 2rem;
        font-size: 1.4rem;
    }
    
    #teams-grid {
        grid-template-columns: 1fr;
    }
}
</style>

<script>
const TIMER_ID = "{{ timer_id }}";
let currentEndTimestamp = null;
let isRunning = false;
let lastMessage = null;
let animationFrameId = null;
let lastSyncTime = 0;
const SYNC_INTERVAL = 500; // Resync every 500ms
let readyPressed = false;

function formatTime(seconds) {
    const absSeconds = Math.abs(seconds);
    const mins = Math.floor(absSeconds / 60);
    const secs = Math.floor(absSeconds % 60);
    const sign = seconds < 0 ? '+' : '';
    return sign + String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
}

function markReady() {
    if (readyPressed) return;
    
    const userId = sessionStorage.getItem('userId') || 'user_' + Math.random().toString(36).substr(2, 9);
    sessionStorage.setItem('userId', userId);
    
    fetch(`/api/timer/${TIMER_ID}/ready`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: userId })
    })
    .then(r => r.json())
    .then(data => {
        if (data.status === 'ok') {
            readyPressed = true;
            document.getElementById('ready-button').classList.add('pressed');
            document.getElementById('ready-button').innerHTML = '<i class="ri-checkbox-circle-fill"></i> Ready!';
        }
    })
    .catch(err => console.error('Error marking ready:', err));
}

function loadTeamInfo() {
    fetch(`/api/timer/${TIMER_ID}/team_info`)
        .then(r => r.json())
        .then(data => {
            if (data.status === 'ok' && data.teams && data.teams.length > 0) {
                const teamsGrid = document.getElementById('teams-grid');
                teamsGrid.innerHTML = '';
                
                data.teams.forEach(team => {
                    const card = document.createElement('div');
                    card.className = `team-card ${team.alliance === 'Red' ? 'red-alliance' : 'blue-alliance'}`;
                    
                    const location = [team.city, team.state, team.country].filter(x => x).join(', ');
                    
                    card.innerHTML = `
                        <div class="team-number">${team.number}</div>
                        <div class="team-name">${team.name || 'N/A'}</div>
                        <div class="team-location">${team.school || location || 'N/A'}</div>
                        <div class="team-stats">
                            <div class="stat-item">
                                <span class="stat-label">Rank:</span>
                                <span class="stat-value">${team.rank || 'N/A'}</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">Avg Score:</span>
                                <span class="stat-value">${team.avgPoints ? team.avgPoints.toFixed(1) : 'N/A'}</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">W-L-T:</span>
                                <span class="stat-value">${team.wins || 0}-${team.losses || 0}-${team.ties || 0}</span>
                            </div>
                        </div>
                    `;
                    
                    teamsGrid.appendChild(card);
                });
                
                document.getElementById('team-info').style.display = 'block';
            }
        })
        .catch(err => console.error('Error loading team info:', err));
}

function updateDisplay() {
    const now = Date.now() / 1000;
    
    if (!isRunning || !currentEndTimestamp) {
        return;
    }
    
    const remaining = currentEndTimestamp - now;
    const display = document.getElementById('timer-display');
    
    // Update display
    display.textContent = formatTime(remaining);
    
    // Update styling based on time
    display.classList.remove('warning', 'danger', 'overtime');
    if (remaining < 0) {
        display.classList.add('overtime');
    } else if (remaining <= 10) {
        display.classList.add('danger');
    } else if (remaining <= 30) {
        display.classList.add('warning');
    }
    
    // Check if we should resync
    if (now - lastSyncTime > SYNC_INTERVAL / 1000) {
        syncTimerState();
    }
    
    // Schedule next frame
    animationFrameId = requestAnimationFrame(updateDisplay);
}

async function syncTimerState() {
    try {
        const response = await fetch(`/api/timer/${TIMER_ID}/state`);
        const data = await response.json();
        
        if (data.status !== 'ok') {
            console.error('Failed to get timer state:', data.message);
            return;
        }
        
        lastSyncTime = data.server_time;
        
        // Update timer name
        document.getElementById('timer-name').textContent = data.timer_name;
        
        // Update running state and end timestamp
        const wasRunning = isRunning;
        isRunning = data.is_running;
        
        if (isRunning !== wasRunning) {
            console.log(`Timer state changed: was running=${wasRunning}, now running=${isRunning}`);
        }
        
        if (isRunning && data.end_timestamp) {
            // Adjust for client-server time difference
            const clientTime = Date.now() / 1000;
            const timeDiff = clientTime - data.server_time;
            currentEndTimestamp = data.end_timestamp + timeDiff;
            
            // Start animation if not already running
            if (!animationFrameId) {
                updateDisplay();
            }
        } else {
            // Timer not running - show static time
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
            
            const display = document.getElementById('timer-display');
            display.textContent = formatTime(data.remaining);
            display.classList.remove('warning', 'danger');
            
            if (data.remaining < 0) {
                display.classList.add('overtime');
            } else {
                display.classList.remove('overtime');
            }
        }
        
        // Update message
        const messageEl = document.getElementById('timer-message');
        if (data.current_message && data.current_message !== lastMessage) {
            messageEl.textContent = data.current_message;
            messageEl.classList.add('show');
            lastMessage = data.current_message;
        } else if (!data.current_message && lastMessage) {
            messageEl.classList.remove('show');
            setTimeout(() => {
                messageEl.textContent = '';
            }, 500);
            lastMessage = null;
        }
        
        // Update display message (broadcast from admin)
        const displayMessageEl = document.getElementById('display-message');
        if (data.display_message) {
            displayMessageEl.textContent = data.display_message;
        } else {
            displayMessageEl.textContent = '';
        }
        
        // Update field info
        if (data.field_id) {
            await updateFieldMatches(data.field_id);
        }
        
    } catch (error) {
        console.error('Error syncing timer state:', error);
    }
}

async function updateFieldMatches(fieldId) {
    try {
        const response = await fetch('/api/scheduled_matches');
        const data = await response.json();
        
        const fieldInfo = document.getElementById('field-info');
        const matchesList = document.getElementById('matches-list');
        
        // Filter matches for this field
        const fieldMatches = data.filter(match => match.field === fieldId).slice(0, 5);
        
        if (fieldMatches.length > 0) {
            fieldInfo.style.display = 'block';
            matchesList.innerHTML = fieldMatches.map(match => {
                const matchName = formatMatchName(match.match);
                const time = new Date(match.startTime).toLocaleTimeString('en-US', {
                    hour: '2-digit',
                    minute: '2-digit'
                });
                
                return `
                    <div class="match-item">
                        <div class="match-number">${matchName}</div>
                        <div class="match-teams">
                            <div class="team">${match.teams.red.join(', ')}</div>
                            <div class="team">${match.teams.blue.join(', ')}</div>
                        </div>
                        <div class="match-time">${time}</div>
                    </div>
                `;
            }).join('');
        } else {
            fieldInfo.style.display = 'none';
        }
    } catch (error) {
        console.error('Error loading field matches:', error);
    }
}

function formatMatchName(match) {
    if (!match) return 'Unknown';
    
    const roundMap = {
        'qual': 'Q',
        'QUAL': 'Q',
        'top_n': 'F',
        'TOP_N': 'F'
    };
    
    const roundKey = typeof match.round === 'string' ? match.round.toLowerCase() : match.round;
    const prefix = roundMap[roundKey] || 'M';
    
    return `${prefix}${match.match || ''}`;
}

// Spotify control functions
let lastSpotifyState = null;

async function updateSpotifyState() {
    try {
        const response = await fetch('/api/spotify/playback');
        const data = await response.json();
        
        const spotifyControls = document.getElementById('spotify-controls');
        const spotifyContent = document.getElementById('spotify-content');
        const spotifyError = document.getElementById('spotify-error');
        
        if (data.status === 'ok' && data.playback) {
            const playback = data.playback;
            lastSpotifyState = playback;
            
            // Show controls
            spotifyControls.style.display = 'block';
            spotifyContent.style.display = 'block';
            spotifyError.style.display = 'none';
            
            // Update track info
            document.getElementById('spotify-track-name').textContent = playback.track_name;
            document.getElementById('spotify-artist-name').textContent = playback.artist_name;
            
            // Update album art
            const albumArt = document.getElementById('spotify-album-art');
            if (playback.album_art_url) {
                albumArt.src = playback.album_art_url;
                albumArt.style.display = 'block';
            } else {
                albumArt.style.display = 'none';
            }
            
            // Update progress
            const currentTime = formatTime(Math.floor(playback.progress_ms / 1000));
            const duration = formatTime(Math.floor(playback.duration_ms / 1000));
            const progress = playback.duration_ms > 0 ? (playback.progress_ms / playback.duration_ms) * 100 : 0;
            
            document.getElementById('spotify-current-time').textContent = currentTime;
            document.getElementById('spotify-duration').textContent = duration;
            document.getElementById('spotify-progress-fill').style.width = progress + '%';
            
            // Update play/pause button
            const playPauseBtn = document.getElementById('spotify-play-pause');
            if (playback.is_playing) {
                playPauseBtn.innerHTML = '<i class="ri-pause-fill"></i>';
                playPauseBtn.title = 'Pause';
            } else {
                playPauseBtn.innerHTML = '<i class="ri-play-fill"></i>';
                playPauseBtn.title = 'Play';
            }
        } else {
            // No playback or error
            if (data.status === 'error') {
                spotifyControls.style.display = 'none';
            } else {
                spotifyControls.style.display = 'block';
                spotifyContent.style.display = 'none';
                spotifyError.style.display = 'block';
                spotifyError.textContent = data.message || 'Nothing playing';
            }
        }
    } catch (error) {
        console.error('Error updating Spotify state:', error);
        document.getElementById('spotify-controls').style.display = 'none';
    }
}

async function spotifyControl(command, metadata = {}) {
    try {
        const response = await fetch('/api/spotify/control', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ command, metadata })
        });
        
        const data = await response.json();
        if (data.status === 'ok') {
            // Wait a moment for Spotify to update
            setTimeout(updateSpotifyState, 500);
        }
    } catch (error) {
        console.error('Error controlling Spotify:', error);
    }
}

async function spotifyTogglePlayPause() {
    if (lastSpotifyState) {
        const command = lastSpotifyState.is_playing ? 'pause' : 'play';
        await spotifyControl(command);
    }
}

function formatTime(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    return `${mins}:${secs.toString().padStart(2, '0')}`;
}

// Initialize timer dropdown in navbar
async function initializeTimerDropdown() {
    try {
        const response = await fetch('/api/timers');
        const timers = await response.json();
        
        // Find the timer icon in the navbar
        const navList = document.querySelector('header nav ul');
        if (navList && Object.keys(timers).length > 0) {
            const timerDropdown = document.createElement('li');
            timerDropdown.className = 'timer-dropdown';
            timerDropdown.innerHTML = `
                <a href="#" title="Switch Timer">
                    <i class="ri-timer-line"></i>
                </a>
                <div class="timer-dropdown-content">
                    ${Object.entries(timers).map(([id, timer]) => `
                        <a href="/timer/${id}" class="${id === TIMER_ID ? 'active' : ''}">
                            ${escapeHtml(timer.name)}
                        </a>
                    `).join('')}
                </div>
            `;
            navList.appendChild(timerDropdown);
        }
    } catch (error) {
        console.error('Error loading timer dropdown:', error);
    }
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// Initialize on load
document.addEventListener('DOMContentLoaded', function() {
    syncTimerState();
    initializeTimerDropdown();
    loadTeamInfo();
    updateSpotifyState();
    
    // Poll for updates every 200ms for instant responsiveness
    setInterval(syncTimerState, 200);
    // Refresh team info every 30 seconds
    setInterval(loadTeamInfo, 30000);
    // Update Spotify state every 2 seconds
    setInterval(updateSpotifyState, 2000);
});

// Cleanup on page unload
window.addEventListener('beforeunload', function() {
    if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
    }
});
</script>
