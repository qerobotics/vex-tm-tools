{#
  Login page
  - Extends `base.html` so it inherits the consolidated CSS and header/nav.
  - Keeps only the page-specific content inside the `content` block.
#}

{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
  <!-- Login form: posts to the auth service -->
  <form action="/service/auth" method="POST" aria-label="Login form">
    <div class="imgcontainer">
      <h2>Hello, please login below.</h2>
      <!-- Avatar served from static files -->
      <img src="{{ url_for('static', filename='img_avatar2.png') }}" alt="avatar" class="avatar">
    </div>

    <div class="container">
      <label for="uname"><b>Username</b></label>
      <input id="uname" name="uname" type="text" placeholder="Enter Username" required>

      <label for="psw"><b>Password</b></label>
      <input id="psw" name="psw" type="password" placeholder="Enter Password" required>

      <div class="but-row">
        <button type="submit">Login</button>
        <button type="button" class="cancelbtn" onclick="window.location.replace('/')">Cancel</button>
      </div>
    </div>
  </form>
{% endblock %}
