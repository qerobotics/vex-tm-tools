{% extends "base.html" %}
{% block body_class %}full-width-match-stats{% endblock %}
{% block title %}Match Stats{% endblock %}

{% block content %}
<style>
  /* Full-screen page layout */
  body.full-width-match-stats {
    margin: 0 !important;
    padding: 0 !important;
  }

  body.full-width-match-stats main {
    max-width: 100% !important;
    width: 100% !important;
    margin: 0 !important;
    padding: 1.5rem !important;
  }

  /* Match Stats Page Specific Styles */
  .match-stats-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
    max-width: 100%;
    margin: 0 auto;
    height: calc(100vh - 120px);
  }

  /* Left Panel - Match List */
  .match-list-panel {
    background: var(--surface);
    border-radius: 12px;
    padding: 1rem;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    border: 1px solid rgba(255,255,255,0.06);
  }

  .match-list-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  .match-list-header h2 {
    margin: 0;
    font-size: 1.25rem;
  }

  .hide-matches-btn {
    background: rgba(122,162,247,0.1);
    color: var(--primary);
    border: 1px solid var(--primary);
    padding: 0.5rem 1rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.875rem;
    transition: all 0.2s;
  }

  .hide-matches-btn:hover {
    background: rgba(122,162,247,0.2);
  }

  .match-list-scroll {
    overflow-y: auto;
    flex: 1;
    scrollbar-width: thin;
    scrollbar-color: var(--primary) var(--surface);
  }

  .match-list-scroll::-webkit-scrollbar {
    width: 8px;
  }

  .match-list-scroll::-webkit-scrollbar-track {
    background: var(--surface);
  }

  .match-list-scroll::-webkit-scrollbar-thumb {
    background: var(--primary);
    border-radius: 4px;
  }

  .match-item {
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.04);
    border-radius: 8px;
    padding: 0.75rem;
    margin-bottom: 0.75rem;
    cursor: pointer;
    transition: all 0.2s;
  }

  .match-item:hover {
    background: rgba(255,255,255,0.04);
    border-color: var(--primary);
  }

  .match-item.active {
    background: rgba(122,162,247,0.1);
    border-color: var(--primary);
  }

  .match-item.current-match {
    border: 2px solid var(--accent);
    box-shadow: 0 0 10px rgba(42,195,222,0.3);
  }

  .match-item.completed {
    opacity: 0.7;
  }

  .match-item-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.5rem;
  }

  .match-name {
    font-weight: 600;
    color: var(--primary);
    font-size: 0.875rem;
  }

  .match-time {
    font-size: 0.75rem;
    color: var(--muted);
  }

  .match-alliances {
    display: flex;
    justify-content: space-between;
    gap: 0.5rem;
  }

  .alliance {
    flex: 1;
    padding: 0.5rem;
    border-radius: 6px;
    font-size: 0.75rem;
  }

  .alliance-red {
    background: rgba(247,118,142,0.15);
    border: 1px solid rgba(247,118,142,0.3);
  }

  .alliance-blue {
    background: rgba(122,162,247,0.15);
    border: 1px solid rgba(122,162,247,0.3);
  }

  .alliance.winner {
    border-width: 2px;
    background: rgba(122,214,128,0.2);
    border-color: #7ad680;
  }

  .alliance-teams {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }

  .team-number {
    font-weight: 500;
  }

  .match-score {
    font-weight: 700;
    font-size: 1rem;
    margin-top: 0.25rem;
    text-align: center;
  }

  /* Right Panel - Match Details */
  .match-details-panel {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  .current-match-banner {
    background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
    border-radius: 12px;
    padding: 2rem;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
  }

  .current-match-banner h1 {
    margin: 0;
    font-size: 2rem;
    color: white;
    text-shadow: 0 2px 4px rgba(0,0,0,0.2);
  }

  .team-cards-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
  }

  .team-card {
    border-radius: 12px;
    padding: 2rem;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    min-height: 300px;
  }

  .team-card-blue {
    background: linear-gradient(135deg, #1e90ff 0%, #00bfff 100%);
    color: white;
  }

  .team-card-red {
    background: linear-gradient(135deg, #ff4757 0%, #ff6348 100%);
    color: white;
  }

  .team-card h2 {
    margin: 0 0 1rem 0;
    font-size: 1.5rem;
    color: white;
  }

  .team-info {
    margin-bottom: 1.5rem;
  }

  .team-detail {
    margin-bottom: 0.75rem;
    font-size: 1rem;
    line-height: 1.5;
  }

  .team-detail strong {
    display: block;
    font-size: 0.875rem;
    opacity: 0.9;
    margin-bottom: 0.25rem;
  }

  .navigation-buttons {
    display: flex;
    gap: 1rem;
    justify-content: center;
  }

  .nav-button {
    background: rgba(122,162,247,0.2);
    color: var(--primary);
    border: 2px solid var(--primary);
    padding: 1rem 2rem;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1rem;
    font-weight: 600;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .nav-button:hover {
    background: rgba(122,162,247,0.3);
    transform: translateY(-2px);
  }

  .nav-button:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .nav-button:disabled:hover {
    transform: none;
  }

  .rankings-section {
    background: var(--surface);
    border-radius: 12px;
    padding: 1.5rem;
    border: 1px solid rgba(255,255,255,0.06);
  }

  .rankings-section h2 {
    margin: 0 0 1rem 0;
    font-size: 1.5rem;
  }

  .rankings-table {
    width: 100%;
    border-collapse: collapse;
  }

  .rankings-table thead {
    background: rgba(122,162,247,0.1);
  }

  .rankings-table th {
    padding: 0.75rem;
    text-align: left;
    font-weight: 600;
    color: var(--primary);
    border-bottom: 2px solid var(--primary);
  }

  .rankings-table td {
    padding: 0.75rem;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  .rankings-table tbody tr:hover {
    background: rgba(255,255,255,0.02);
  }

  .rank-cell {
    font-weight: 700;
    color: var(--accent);
  }

  .team-cell {
    font-weight: 600;
  }

  .no-match-selected {
    background: var(--surface);
    border-radius: 12px;
    padding: 3rem;
    text-align: center;
    color: var(--muted);
  }

  .no-match-selected i {
    font-size: 3rem;
    margin-bottom: 1rem;
    color: var(--primary);
  }

  .loading {
    text-align: center;
    padding: 2rem;
    color: var(--muted);
  }

  .error-message {
    background: rgba(247,118,142,0.1);
    border: 1px solid var(--danger);
    border-radius: 8px;
    padding: 1rem;
    color: var(--danger);
    text-align: center;
  }
</style>

<div class="match-stats-container">
  <!-- Left Panel: Match List -->
  <div class="match-list-panel">
    <div class="match-list-header">
      <h2><i class="ri-trophy-line"></i> Match Results</h2>
      <button class="hide-matches-btn" onclick="toggleCompletedMatches()">
        <span id="toggle-text">Hide Matches</span>
      </button>
    </div>
    <div class="match-list-scroll" id="matchListScroll">
      <div id="matchList" class="loading">
        <i class="ri-loader-4-line"></i> Loading matches...
      </div>
    </div>
  </div>

  <!-- Right Panel: Match Details -->
  <div class="match-details-panel">
    <div id="matchDetails">
      <div class="no-match-selected">
        <i class="ri-information-line"></i>
        <h2>No Match Selected</h2>
        <p>Select a match from the list to view details and team statistics</p>
      </div>
    </div>
  </div>
</div>

<script>
let scheduleData = null;
let teamsData = {};
let rankingsData = {};
let currentMatchIndex = 0;
let allMatches = [];
let selectedMatchIndex = null;
let hideCompleted = false;

async function fetchScheduleData() {
  try {
    const response = await fetch('/api/match_stats/schedule');
    const data = await response.json();
    
    if (data.status === 'ok') {
      scheduleData = data.schedule;
      
      // Build flat list of all matches
      allMatches = [];
      if (scheduleData && scheduleData.divisions) {
        for (const division of scheduleData.divisions) {
          if (division.matches) {
            for (const match of division.matches) {
              allMatches.push({
                division: division,
                match: match
              });
            }
          }
        }
      }
      
      // Find current match index
      if (data.current_match) {
        const currentIdx = allMatches.findIndex(m => {
          const matchTuple = m.match.matchInfo?.matchTuple;
          return matchTuple &&
                 matchTuple.division === data.current_match.division &&
                 matchTuple.match === data.current_match.match &&
                 matchTuple.round === data.current_match.round;
        });
        if (currentIdx >= 0) {
          currentMatchIndex = currentIdx;
          selectedMatchIndex = currentIdx;
        }
      }
      
      // Fetch teams and rankings for each division
      const divisionIds = [...new Set(scheduleData.divisions.map(d => d.id))];
      await Promise.all(divisionIds.map(async (divId) => {
        await fetchTeamsData(divId);
        await fetchRankingsData(divId);
      }));
      
      renderMatchList();
      if (selectedMatchIndex !== null) {
        renderMatchDetails(selectedMatchIndex);
        scrollToMatch(selectedMatchIndex);
      }
    } else {
      document.getElementById('matchList').innerHTML = 
        '<div class="error-message">Failed to load match data</div>';
    }
  } catch (error) {
    console.error('Error fetching schedule:', error);
    document.getElementById('matchList').innerHTML = 
      '<div class="error-message">Error loading match data</div>';
  }
}

async function fetchTeamsData(divisionId) {
  try {
    const response = await fetch(`/api/match_stats/teams/${divisionId}`);
    const data = await response.json();
    
    if (data.status === 'ok' && data.teams && data.teams.teams) {
      teamsData[divisionId] = {};
      for (const team of data.teams.teams) {
        teamsData[divisionId][team.number] = team;
      }
    }
  } catch (error) {
    console.error('Error fetching teams:', error);
  }
}

async function fetchRankingsData(divisionId) {
  try {
    const response = await fetch(`/api/match_stats/rankings/${divisionId}`);
    const data = await response.json();
    
    if (data.status === 'ok' && data.rankings && data.rankings.rankings) {
      rankingsData[divisionId] = {};
      for (const ranking of data.rankings.rankings) {
        const teams = ranking.alliance?.teams || [];
        for (const team of teams) {
          rankingsData[divisionId][team.number] = ranking;
        }
      }
    }
  } catch (error) {
    console.error('Error fetching rankings:', error);
  }
}

function renderMatchList() {
  const container = document.getElementById('matchList');
  container.innerHTML = '';
  
  allMatches.forEach((item, index) => {
    const match = item.match;
    const matchInfo = match.matchInfo;
    const matchTuple = matchInfo?.matchTuple;
    const alliances = matchInfo?.alliances || [];
    
    const isCompleted = match.score && (match.score.redScore !== null || match.score.blueScore !== null);
    if (hideCompleted && isCompleted) return;
    
    const isCurrent = index === currentMatchIndex;
    const isSelected = index === selectedMatchIndex;
    
    const matchDiv = document.createElement('div');
    matchDiv.className = `match-item ${isSelected ? 'active' : ''} ${isCurrent ? 'current-match' : ''} ${isCompleted ? 'completed' : ''}`;
    matchDiv.onclick = () => selectMatch(index);
    
    // Match name
    const matchName = `${matchTuple?.round || 'QUAL'} #${matchTuple?.match || '?'}`;
    const matchTime = match.scheduledTime || '';
    
    // Get teams
    const redAlliance = alliances[0] || { teams: [] };
    const blueAlliance = alliances[1] || { teams: [] };
    
    const redScore = match.score?.redScore ?? '';
    const blueScore = match.score?.blueScore ?? '';
    const redWon = isCompleted && redScore > blueScore;
    const blueWon = isCompleted && blueScore > redScore;
    
    matchDiv.innerHTML = `
      <div class="match-item-header">
        <span class="match-name">${matchName}</span>
        ${matchTime ? `<span class="match-time">${new Date(matchTime).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>` : ''}
      </div>
      <div class="match-alliances">
        <div class="alliance alliance-red ${redWon ? 'winner' : ''}">
          <div class="alliance-teams">
            ${redAlliance.teams.map(t => `<span class="team-number">${t.number}</span>`).join('')}
          </div>
          ${redScore !== '' ? `<div class="match-score">${redScore}</div>` : ''}
        </div>
        <div class="alliance alliance-blue ${blueWon ? 'winner' : ''}">
          <div class="alliance-teams">
            ${blueAlliance.teams.map(t => `<span class="team-number">${t.number}</span>`).join('')}
          </div>
          ${blueScore !== '' ? `<div class="match-score">${blueScore}</div>` : ''}
        </div>
      </div>
    `;
    
    container.appendChild(matchDiv);
  });
}

function selectMatch(index) {
  selectedMatchIndex = index;
  renderMatchList();
  renderMatchDetails(index);
}

function renderMatchDetails(index) {
  const item = allMatches[index];
  const match = item.match;
  const division = item.division;
  const matchInfo = match.matchInfo;
  const matchTuple = matchInfo?.matchTuple;
  const alliances = matchInfo?.alliances || [];
  
  const matchName = `${matchTuple?.round || 'QUAL'} Match #${matchTuple?.match || '?'}`;
  
  const redAlliance = alliances[0] || { teams: [] };
  const blueAlliance = alliances[1] || { teams: [] };
  
  // Get team details
  const divTeams = teamsData[division.id] || {};
  const divRankings = rankingsData[division.id] || {};
  
  const detailsHtml = `
    <div class="current-match-banner">
      <h1>${matchName}</h1>
    </div>
    
    <div class="team-cards-container">
      <div class="team-card team-card-blue">
        <h2><i class="ri-team-line"></i> Blue Alliance</h2>
        ${blueAlliance.teams.map(t => {
          const team = divTeams[t.number] || {};
          const ranking = divRankings[t.number] || {};
          return `
            <div class="team-info">
              <div class="team-detail">
                <strong>Team ${t.number}</strong>
                ${team.name || 'Unknown Team'}
              </div>
              <div class="team-detail">
                ${[team.school, team.city, team.state, team.country].filter(x => x).join(' - ')}
              </div>
              <div class="team-detail">
                <strong>Ranking:</strong> #${ranking.rank || 'N/A'}
              </div>
              <div class="team-detail">
                <strong>Qual Stats:</strong> ${ranking.wins || 0}-${ranking.losses || 0}-${ranking.ties || 0}
              </div>
            </div>
          `;
        }).join('')}
      </div>
      
      <div class="team-card team-card-red">
        <h2><i class="ri-team-line"></i> Red Alliance</h2>
        ${redAlliance.teams.map(t => {
          const team = divTeams[t.number] || {};
          const ranking = divRankings[t.number] || {};
          return `
            <div class="team-info">
              <div class="team-detail">
                <strong>Team ${t.number}</strong>
                ${team.name || 'Unknown Team'}
              </div>
              <div class="team-detail">
                ${[team.school, team.city, team.state, team.country].filter(x => x).join(' - ')}
              </div>
              <div class="team-detail">
                <strong>Ranking:</strong> #${ranking.rank || 'N/A'}
              </div>
              <div class="team-detail">
                <strong>Qual Stats:</strong> ${ranking.wins || 0}-${ranking.losses || 0}-${ranking.ties || 0}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
    
    <div class="navigation-buttons">
      <button class="nav-button" onclick="previousMatch()" ${index === 0 ? 'disabled' : ''}>
        <i class="ri-arrow-left-line"></i> Prev Match
      </button>
      <button class="nav-button" onclick="nextMatch()" ${index === allMatches.length - 1 ? 'disabled' : ''}>
        Next Match <i class="ri-arrow-right-line"></i>
      </button>
    </div>
    
    <div class="rankings-section">
      <h2><i class="ri-bar-chart-line"></i> Match Rankings</h2>
      <table class="rankings-table">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Team</th>
            <th>Name</th>
            <th>W-L-T</th>
            <th>WP / AP / SP</th>
          </tr>
        </thead>
        <tbody>
          ${[...blueAlliance.teams, ...redAlliance.teams].map(t => {
            const team = divTeams[t.number] || {};
            const ranking = divRankings[t.number] || {};
            return `
              <tr>
                <td class="rank-cell">${ranking.rank || '-'}</td>
                <td class="team-cell">${t.number}</td>
                <td>${team.name || 'Unknown'}</td>
                <td>${ranking.wins || 0}-${ranking.losses || 0}-${ranking.ties || 0}</td>
                <td>${ranking.wp || 0} / ${ranking.ap || 0} / ${ranking.sp || 0}</td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
  
  document.getElementById('matchDetails').innerHTML = detailsHtml;
}

function previousMatch() {
  if (selectedMatchIndex > 0) {
    selectMatch(selectedMatchIndex - 1);
    scrollToMatch(selectedMatchIndex);
  }
}

function nextMatch() {
  if (selectedMatchIndex < allMatches.length - 1) {
    selectMatch(selectedMatchIndex + 1);
    scrollToMatch(selectedMatchIndex);
  }
}

function scrollToMatch(index) {
  const matchItems = document.querySelectorAll('.match-item');
  if (matchItems[index]) {
    matchItems[index].scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function toggleCompletedMatches() {
  hideCompleted = !hideCompleted;
  document.getElementById('toggle-text').textContent = hideCompleted ? 'Show Matches' : 'Hide Matches';
  renderMatchList();
}

// Auto-refresh every 30 seconds
setInterval(() => {
  fetchScheduleData();
}, 30000);

// Initial load
fetchScheduleData();
</script>

{% endblock %}
