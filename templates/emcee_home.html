{% extends 'base.html' %}

{% block title %}Emcee Dashboard{% endblock %}

{% block content %}
<style>
.emcee-home-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 200px);
    gap: 2rem;
}

.emcee-home-container h1 {
    font-size: 3rem;
    text-align: center;
    margin-bottom: 1rem;
}

.emcee-buttons {
    display: flex;
    gap: 2rem;
    flex-wrap: wrap;
    justify-content: center;
}

.emcee-btn {
    background: var(--surface);
    border: 2px solid rgba(122, 162, 247, 0.3);
    border-radius: 16px;
    padding: 3rem 4rem;
    min-width: 280px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    cursor: pointer;
    transition: all 0.3s ease;
    text-decoration: none;
    color: var(--fg);
}

.emcee-btn:hover {
    transform: translateY(-8px);
    border-color: var(--primary);
    box-shadow: 0 12px 40px rgba(122, 162, 247, 0.3);
    background: linear-gradient(135deg, rgba(122, 162, 247, 0.15), rgba(42, 195, 222, 0.1));
}

.emcee-btn i {
    font-size: 5rem;
    color: var(--primary);
    margin: 0;
}

.emcee-btn span {
    font-size: 1.75rem;
    font-weight: 600;
    color: var(--fg);
}

.emcee-btn-subtitle {
    font-size: 1rem;
    color: var(--muted);
    text-align: center;
}

@media (max-width: 768px) {
    .emcee-home-container h1 {
        font-size: 2rem;
    }
    
    .emcee-buttons {
        flex-direction: column;
        width: 100%;
        padding: 0 1rem;
    }
    
    .emcee-btn {
        width: 100%;
        min-width: unset;
        padding: 2rem;
    }
    
    .emcee-btn i {
        font-size: 4rem;
    }
    
    .emcee-btn span {
        font-size: 1.5rem;
    }
}
</style>

<div class="emcee-home-container">
    <h1><i class="ri-mic-line"></i> Emcee Dashboard</h1>
    
    <div class="emcee-buttons">
        <a href="{{ url_for('timers_overview') }}" class="emcee-btn">
            <i class="ri-timer-line"></i>
            <span>Timers</span>
            <div class="emcee-btn-subtitle">View and monitor event timers</div>
        </a>
        
        <a href="{{ url_for('match_stats') }}" class="emcee-btn">
            <i class="ri-bar-chart-box-line"></i>
            <span>Match Stats</span>
            <div class="emcee-btn-subtitle">View live match statistics</div>
        </a>
    </div>
</div>
{% endblock %}
