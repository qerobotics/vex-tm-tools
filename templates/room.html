{% extends 'base.html' %}

{% block title %}Room {{ room_id }}{% endblock %}

{% block content %}
<section>
    <h1>Welcome to Room {{ room_id }}</h1>
    <p class="muted">Team(s): {{ room_info.teams | join(', ') }}</p>

    {% if room_info.youtube_embed_url %}
    <div class="video-container">
        <iframe width="100%" height="500" src="{{ room_info.youtube_embed_url }}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
    {% endif %}

    <div id="popup-container" class="popup"></div>
</section>

<script>
    const ROOM_ID = "{{ room_id }}";
    const TEAMS_IN_ROOM = {{ room_info.teams | tojson | safe }};

    function showPopup(message, duration = 10) {
        const container = document.getElementById('popup-container');
        container.innerText = message;
        container.style.display = 'block';
        setTimeout(() => {
            container.style.display = 'none';
        }, duration * 1000);
    }

    async function checkScheduledMatches() {
        const response = await fetch('/api/scheduled_matches');
        const data = await response.json();
        
        if (data && data.rooms && data.rooms.includes(ROOM_ID)) {
            const teams = data.teams.join(', ');
            showPopup(`Upcoming Match for ${teams}! Match: ${JSON.stringify(data.match_id)}`);
        }
    }

    async function checkManualPopups() {
        const response = await fetch('/api/popups');
        const popups = await response.json();
        
        const roomPopup = popups.find(p => p.room_id === ROOM_ID);
        if (roomPopup) {
            showPopup(roomPopup.message, roomPopup.duration);
            // A real implementation would need a way to clear this popup
        }
    }

    setInterval(checkScheduledMatches, 5000);
    setInterval(checkManualPopups, 5000);
</script>

<style>
    .video-container {
        margin-bottom: 1rem;
    }
    .popup {
        display: none;
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background-color: var(--color-warning);
        color: black;
        padding: 1rem 2rem;
        border-radius: 8px;
        font-size: 1.5rem;
        z-index: 1000;
    }
</style>
{% endblock %}
