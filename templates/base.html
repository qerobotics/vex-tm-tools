<!DOCTYPE html>
<!--
  Base template for the application.
  - Contains consolidated CSS (Tokyo Night Storm theme) so styles live with templates.
  - Provides a header/nav that uses session to toggle links.
  - Exposes `title` and `content` blocks for child templates to fill.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
  <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.png') }}" />
  <title>{% block title %}{% endblock %} - Vex TM Manager Tools</title>

  <!-- Consolidated Tokyo Night Storm CSS (kept here for simplicity and easy editing) -->
  <style>
  :root {
      /* Tokyo Night Storm-inspired palette */
      --bg: #0b1226;        /* deep navy */
      --bg-2: #0f1724;      /* slightly lighter */
      --surface: #111827;   /* cards / nav */
      --fg: #cbd6f5;        /* soft bluish text */
      --muted: #7b8396;     /* muted text */
      --primary: #7aa2f7;   /* bright blue */
      --secondary: #9d7cd8; /* purple accent */
      --accent: #2ac3de;    /* cyan accent */
      --danger: #f7768e;    /* pink/red */
  }

  /* Base page layout */
  html,body{height:100%;}
  body {
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      line-height: 1.45;
      margin: 0;
      padding: 0;
  }

  /* Typographic scale */
  h1,h2,h3,h4{color:var(--primary);margin:0 0 .5rem 0}
  p, label, input, button {color:var(--fg)}

  /* Header / nav */
  header{background: rgba(11,17,38,0.6); backdrop-filter: blur(6px);}
  header ul{list-style:none;margin:0;padding:0;display:flex;gap:.25rem;align-items:center}
  header li{display:inline-block}
  header a{display:block;padding:12px 16px;text-decoration:none;color:var(--fg);border-radius:6px}
  header a:hover{background:rgba(122,162,247,0.06)}
  header .active{background:var(--secondary);color:var(--bg)}

  /* Main content area */
  main{max-width:920px;margin:2rem auto;padding:1.25rem}

  /* Forms: a clean, accessible set of styles used by auth pages */
  form{background:rgba(255,255,255,0.02);padding:1rem;border-radius:8px;border:1px solid rgba(255,255,255,0.03)}
  .imgcontainer{text-align:center;margin:1rem 0}
  /* Larger avatar for better visibility; responsive cap applies below */
  img.avatar{width:180px;max-width:40%;border-radius:50%;box-shadow:0 6px 28px rgba(0,0,0,0.45)}
  .container{padding:8px}

  input[type=text], input[type=password], input[type=email] {
    width:100%;padding:10px 12px;margin:8px 0;border-radius:6px;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.02);color:var(--fg);
  }

  button {
    background-color: var(--primary);
    color: var(--bg);
    border: none;padding:10px 14px;border-radius:6px;cursor:pointer;font-weight:600
  }
  .cancelbtn{background:var(--danger);color:var(--bg)}
  .but-row{display:flex;gap:.5rem}

  .muted{color:var(--muted);font-size:.95rem}

  /* Alerts and messages */
  .alert{padding:10px 12px;border-radius:6px;margin-bottom:0.75rem}
  .alert-error{background:linear-gradient(180deg, rgba(247,118,142,0.08), rgba(247,118,142,0.04));border:1px solid rgba(247,118,142,0.12);color:var(--danger)}

  @media (max-width:600px){
    header ul{flex-direction:column;align-items:stretch}
    .but-row{flex-direction:column}
    /* Smaller avatars on narrow screens */
    img.avatar{width:120px;max-width:36%}
  }
  </style>

</head>
<body class="{% block body_class %}{% endblock %}">
  <!--
    Site header shared by all pages. It uses `session` to show auth links.
    Keep markup minimal; presentation is handled by the consolidated CSS above.
  -->
  <header>
    <nav>
      <ul>
        <li>
          <a href="{{ url_for('index') }}" class="{{ 'active' if request.path == url_for('index') else '' }}">Home</a>
        </li>
        {% if 'user' in session %}
          <li>
            <a href="{{ url_for('config_page') }}" class="{{ 'active' if request.path == url_for('config_page') else '' }}">Configuration</a>
          </li>
          <li>
            <a href="{{ url_for('pause_controls') }}" class="{{ 'active' if request.path == url_for('pause_controls') else '' }}">Pause Controls</a>
          </li>
          <li>
            <a href="{{ url_for('room_management') }}" class="{{ 'active' if request.path == url_for('room_management') else '' }}">Room Management</a>
          </li>
          <li>
            <a href="{{ url_for('controls_page') }}" class="{{ 'active' if request.path == url_for('controls_page') else '' }}">Manual Controls</a>
          </li>
          <li>
            <a href="{{ url_for('profile') }}" class="{{ 'active' if request.path == url_for('profile') else '' }}">Profile</a>
          </li>
          <li>
            <a href="{{ url_for('logout') }}" class="{{ 'active' if request.path == url_for('logout') else '' }}">Logout</a>
          </li>
        {% else %}
          <li>
            <a href="{{ url_for('login') }}" class="{{ 'active' if request.path == url_for('login') else '' }}">Login</a>
          </li>
        {% endif %}
      </ul>
    </nav>
  </header>

  <!-- Main content block: child templates should populate this -->
  <main>
    {% block content %}{% endblock %}
  </main>

</body>
</html>
