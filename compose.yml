services:
  cloudflared:
    container_name: cloudflared
    image: cloudflare/cloudflared:latest
    # Token pulled from .env (untracked) — never hardcode it here, it's a
    # live credential that lets anyone holding it register as a connector
    # on the tunnel.
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    env_file:
      - .env
    networks:
      - cf
    restart: unless-stopped
    
  # ─────────────────────────────────────────────────────────────────────
  # QEComp (FastAPI/Postgres/Redis/MinIO stack). Replaces the legacy Flask
  # app previously deployed here (`vex-tm-manager-tools`, removed per plan
  # §16's legacy-deletion table alongside `server.py`/`main.py`/etc). Bring
  # up the full local dev stack with:
  #   docker compose up -d
  # or just the infra (if running the backend directly via uvicorn/a venv
  # for faster iteration) with:
  #   docker compose up -d postgres redis minio
  # ─────────────────────────────────────────────────────────────────────
  app:
    container_name: qecomp-app
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      cf:
        ipv4_address: 10.65.1.20
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      bucket-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-shot init container mirroring k8s/deployment.yaml's `initContainers:
  # migrate` (same image, same `alembic upgrade head` command) so a fresh
  # `docker compose up` doesn't leave Postgres with zero tables until an
  # operator manually execs in and runs migrations. Runs once per `up` and
  # exits; `app` (and the replicas overlay's `backend`) wait on it via
  # `condition: service_completed_successfully`.
  migrate:
    container_name: qecomp-migrate
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Container-network hostname — .env's POSTGRES_DSN points at the
      # *published* host port (localhost:5433), unreachable from inside
      # the compose network.
      POSTGRES_DSN: postgresql+asyncpg://qecomp:qecomp@postgres:5432/qecomp
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # One-shot init step that creates the configured S3_BUCKET in MinIO if it
  # doesn't already exist, so the first video upload doesn't fail with
  # NoSuchBucket on a clean `docker compose down -v`. Uses the official
  # MinIO Client image rather than scripting `curl`/`aws` by hand.
  bucket-init:
    container_name: qecomp-bucket-init
    image: minio/mc:latest
    env_file:
      - .env
    environment:
      # Container-network hostname — .env's S3_ENDPOINT_URL points at the
      # *published* host port (localhost:9000), unreachable from inside
      # the compose network.
      S3_ENDPOINT_URL: http://minio:9000
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local "$$S3_ENDPOINT_URL" "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" &&
        mc mb --ignore-existing "local/$$S3_BUCKET"
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  postgres:
    container_name: qecomp-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qecomp
      POSTGRES_PASSWORD: qecomp
      POSTGRES_DB: qecomp
    ports:
      - "5433:5432"
    volumes:
      - qecomp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qecomp -d qecomp"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    container_name: qecomp-redis
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    container_name: qecomp-minio
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - qecomp_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  cf:
    name: 'cf'
    ipam:
     config:
       - subnet: 10.65.1.0/24

volumes:
  qecomp_postgres_data:
  qecomp_minio_data:
