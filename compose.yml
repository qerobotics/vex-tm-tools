services:
  cloudflared:
    container_name: cloudflared
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token REDACTED-CLOUDFLARE-TUNNEL-TOKEN
    networks:
      cf:
    extra_hosts:
      - "host.docker.internal:host-gateway"

    
  vex-tm-manager-tools:
    container_name: vex-tm-manager-tools
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      cf:
        ipv4_address: 10.65.1.2
    volumes:
      - ".:/srv/vtmt"


networks:
  cf:
    name: 'cf'
    ipam:
     config:
       - subnet: 10.65.1.0/24
